# =============================================================================
# MAXNATE 3D WEBSITE - DOCKER COMPOSE
# Local development and testing configuration
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Development Service
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: maxnate-dev
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    networks:
      - maxnate-network

  # ---------------------------------------------------------------------------
  # Production Build Test
  # ---------------------------------------------------------------------------
  production:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: maxnate-prod
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - maxnate-network
    profiles:
      - prod

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Optional - for production-like testing)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: maxnate-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - production
    networks:
      - maxnate-network
    profiles:
      - prod-full

networks:
  maxnate-network:
    driver: bridge

volumes:
  node_modules:
  next_cache:
