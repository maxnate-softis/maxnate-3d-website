# =============================================================================
# MAXNATE 3D WEBSITE - CLOUD BUILD PIPELINE (PRODUCTION)
# Manual trigger or tag-based deployment to production
# =============================================================================

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Run Full Test Suite
  # ---------------------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'install-deps'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:20-alpine'
    id: 'run-lint'
    entrypoint: 'npm'
    args: ['run', 'lint']
    waitFor:
      - 'install-deps'

  - name: 'node:20-alpine'
    id: 'run-typecheck'
    entrypoint: 'npm'
    args: ['run', 'typecheck']
    waitFor:
      - 'install-deps'

  - name: 'node:20-alpine'
    id: 'run-build-test'
    entrypoint: 'npm'
    args: ['run', 'build']
    waitFor:
      - 'run-lint'
      - 'run-typecheck'

  # ---------------------------------------------------------------------------
  # Step 2: Build Production Docker Image
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${TAG_NAME}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:production'
      - '-f'
      - 'docker/Dockerfile'
      - '.'
    waitFor:
      - 'run-build-test'

  # ---------------------------------------------------------------------------
  # Step 3: Push Image to Artifact Registry
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}'
    waitFor:
      - 'build-image'

  # ---------------------------------------------------------------------------
  # Step 4: Deploy to Cloud Run (Production)
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-production'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${TAG_NAME}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--concurrency=${_CONCURRENCY}'
      - '--port=3000'
      - '--cpu-boost'
      - '--execution-environment=gen2'
      - '--set-env-vars=NODE_ENV=production'
      - '--labels=version=${TAG_NAME},environment=production'
    waitFor:
      - 'push-image'

  # ---------------------------------------------------------------------------
  # Step 5: Update Traffic to New Revision
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-traffic'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - '${_SERVICE_NAME}'
      - '--region=${_REGION}'
      - '--to-latest'
    waitFor:
      - 'deploy-production'

# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------
substitutions:
  _REGION: 'africa-south1'
  _ARTIFACT_REPO: 'maxnate-registry'
  _SERVICE_NAME: 'maxnate-website'
  _MEMORY: '2Gi'
  _CPU: '2'
  _MIN_INSTANCES: '1'
  _MAX_INSTANCES: '20'
  _CONCURRENCY: '100'

# -----------------------------------------------------------------------------
# Build Options
# -----------------------------------------------------------------------------
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${TAG_NAME}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:production'

timeout: '1800s'
