# =============================================================================
# MAXNATE 3D WEBSITE - CLOUD BUILD PIPELINE (STAGING)
# Triggered on push to develop branch - deploys to staging
# =============================================================================

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Run Tests
  # ---------------------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'install-deps'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:20-alpine'
    id: 'run-lint'
    entrypoint: 'npm'
    args: ['run', 'lint']
    waitFor:
      - 'install-deps'

  - name: 'node:20-alpine'
    id: 'run-typecheck'
    entrypoint: 'npm'
    args: ['run', 'typecheck']
    waitFor:
      - 'install-deps'

  # ---------------------------------------------------------------------------
  # Step 2: Build Docker Image
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}-staging:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}-staging:latest'
      - '-f'
      - 'docker/Dockerfile'
      - '.'
    waitFor:
      - 'run-lint'
      - 'run-typecheck'

  # ---------------------------------------------------------------------------
  # Step 3: Push Image to Artifact Registry
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}-staging'
    waitFor:
      - 'build-image'

  # ---------------------------------------------------------------------------
  # Step 4: Deploy to Cloud Run (Staging)
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-staging'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}-staging'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}-staging:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--port=3000'
      - '--set-env-vars=NODE_ENV=staging'
    waitFor:
      - 'push-image'

# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------
substitutions:
  _REGION: 'africa-south1'
  _ARTIFACT_REPO: 'maxnate-registry'
  _SERVICE_NAME: 'maxnate-website'

# -----------------------------------------------------------------------------
# Build Options
# -----------------------------------------------------------------------------
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}-staging:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}-staging:latest'

timeout: '1200s'
